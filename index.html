<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>
<style>
.acc-content{max-height:0;overflow:hidden;transition:max-height 0.6s ease}

<body class="bg-gray-100">

<!-- 2. PERCENTAGE - FULL PLAYLIST INSIDE -->
<div class="bg-white rounded-2xl shadow-lg mb-4 border-2 border-yellow-400 overflow-hidden">

</div>
</div>

<div class="bg-gray-50 p-2 rounded-xl">
<p class="font-bold text-sm mb-2">Class 2 - Tricks</p>
<div class="aspect-video rounded-xl overflow-hidden">
<iframe class="w-full h-full" src="https://www.youtube.com/embed/videoseries?listType=search&list=Percentage+Class+2+by+Gagan+Pratap+Sir" allowfullscreen></iframe>
</div>
</div>

<div class="bg-gray-50 p-2 rounded-xl">
<p class="font-bold text-sm mb-2">Class 3 - PYQ + Questions</p>
<div class="aspect-video rounded-xl overflow-hidden">
<iframe class="w-full h-full" src="https://www.youtube.com/embed/videoseries?listType=search&list=Percentage+Class+3+by+Gagan+Pratap+Sir" allowfullscreen></iframe>
</div>
</div>

<div class="bg-gray-50 p-2 rounded-xl">

<div class="aspect-video rounded-xl overflow-hidden">

</div>
</div>

</div>

</div>

<script>
function toggleAcc(id){
const el=document.getElementById(id);
const ic=document.getElementById('i-'+id);
el.classList.toggle('open');
if(ic) ic.textContent=el.classList.contains('open')?'▲':'▼';
}
</script>
