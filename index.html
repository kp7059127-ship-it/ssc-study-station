let activePerc = 0;

function loadPlaylist(activeIndex){
  activePerc = activeIndex;
  document.getElementById('playlist').innerHTML = videos.map((v,i)=>`

    </div>
  `).join('');

function loadPlaylist2(activeIndex){

  document.getElementById('nowTitle').innerText = "▶ " + videos[i].title;
  loadPlaylist(i);
  document.getElementById('mainPlayer').scrollIntoView({behavior:'smooth'});
}

function playVideo2(i){
