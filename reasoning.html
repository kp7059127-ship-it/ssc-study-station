<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC Study Station - Reasoning</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.video-card{border:1px solid #ddd; border-radius:12px; overflow:hidden; background:#fff; margin-bottom:16px;}
.video-header{display:flex; align-items:center; gap:12px; padding:12px; background:#f8f8f8;}
.video-num{background:black; color:white; min-width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; font-weight:bold;}
.video-thumb{position:relative; cursor:pointer; background:black; aspect-ratio:16/9;}
.video-thumb img{width:100%; height:100%; object-fit:cover;}
.play-btn{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.65); width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:28px;}
.playlist-header{margin:30px 0 14px 0; padding:12px 16px; background:#111; color:white; border-radius:8px;}
</style>
</head>
<body class="bg-gray-100">
<div class="max-w-3xl mx-auto p-3">
<h1 class="text-2xl font-bold text-center my-4">SSC Study Station - Reasoning</h1>

<div style="margin:10px 0 25px 0; padding:20px; background:linear-gradient(135deg, #0f4c0f, #2e8b57, #000000); color:white; border-radius:12px; text-align:center; border:2px solid #00ff88;">
  <h2 style="margin:0; font-size:24px; font-weight:900;">🧠 REASONING START 🧠</h2>
  <p style="margin:8px 0 0 0; font-size:14px; color:#00ff88;">Verbal | Non-Verbal | Critical Reasoning</p>
</div>

<div class="playlist-header"><h2>🧠 P1 - CRITICAL REASONING</h2></div><div id="p1"></div>
<div class="playlist-header"><h2>🧩 P2 - ANALOGY</h2></div><div id="p2"></div>
<div class="playlist-header"><h2>🔤 P3 - CLASSIFICATION</h2></div><div id="p3"></div>

<div style="margin:40px 0 20px 0; padding:16px; background:linear-gradient(135deg, #000000, #434343); color:white; border-radius:12px; text-align:center; border:2px solid gold;">
  <h2 style="margin:0; font-size:22px; font-weight:800;">✅ REASONING COMPLETE ✅</h2>
</div>
</div>

<script>
const data = {
p1: [
["Critical Reasoning - Full Class", "K83uBTBwb0c"]
],
p2: [],
p3: []
};

function render(){
  for(const pid in data){
    const c=document.getElementById(pid);
    if(!c) continue;
    c.innerHTML=data[pid].map((v,i)=>`
      <div class="video-card">
        <div class="video-header"><div class="video-num">${i+1}</div><div style="font-weight:700;">${v[0]}</div></div>
        <div class="video-thumb" onclick="this.innerHTML='<iframe style=width:100%;aspect-ratio:16/9;border:0; src=https://www.youtube.com/embed/'+v[1]+'?autoplay=1&rel=0 allowfullscreen></iframe>'"><img src="https://img.youtube.com/vi/${v[1]}/hqdefault.jpg"><div class="play-btn">▶</div></div>
      </div>`).join('');
  }
}
render();
</script>
</body>
</html>
